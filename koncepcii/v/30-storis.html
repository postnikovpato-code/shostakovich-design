<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Шостакович — Сторис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;1,300&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#110D0F; --text:#F6EFEF; --dim:#BBAAB0; --wine:#8B2039; --pink:#E6B9C6;
  --serif:"Noto Serif Display",Georgia,serif; --sans:"Montserrat",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.backdrop{position:fixed;inset:-40px;background:#110d0f url("photos/hero.jpg") center/cover;filter:blur(40px) brightness(.35) saturate(1.2)}
.layout{position:relative;height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;padding:20px}
.aside{max-width:300px;justify-self:end}
.aside.r{justify-self:start}
.aside .logo{font:400 26px/1 var(--serif);letter-spacing:.2em;margin-bottom:10px}
.aside p{color:var(--dim);margin:0 0 14px}
.aside .kbd{font-size:12px;color:var(--dim)}
.aside .kbd b{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 6px;margin-right:4px;color:var(--text)}
@media(max-width:1000px){.aside{display:none}.layout{grid-template-columns:1fr;padding:0}}

/* Телефон со сторис */
.phone{position:relative;height:min(92vh,820px);aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.6)}
@media(max-width:1000px){.phone{height:100%;width:100%;aspect-ratio:auto;border-radius:0}}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .35s;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 22px 110px}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:0;background-color:#1a1014;background-size:cover;background-repeat:no-repeat}
.slide .bg.photo{background-image:url("photos/hero.jpg")}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,6,8,.92) 0%,rgba(10,6,8,.2) 55%,rgba(10,6,8,.45) 100%)}
.slide > *:not(.bg){position:relative;z-index:1}
.slide .tag{align-self:flex-start;font:600 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;background:var(--wine);padding:7px 10px;border-radius:4px;margin-bottom:14px}
.slide h2{font:400 clamp(34px,4.6vh,46px)/1 var(--serif);letter-spacing:-.02em;margin:0 0 12px}
.slide h2 i{font-weight:300;color:var(--pink)}
.slide p{margin:0;color:#E8DADF;font-size:15px;max-width:30ch}
.slide ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.slide li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:8px;font-variant-numeric:tabular-nums}
.slide li b{font:400 22px/1 var(--serif)}
.slide li.first b{color:var(--pink)}
.slide .sticker{position:absolute;right:18px;top:120px;z-index:2;background:#fff;color:#1e1417;border-radius:14px;padding:10px 14px;font:600 13px/1.2 var(--sans);transform:rotate(6deg);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.slide .sticker b{display:block;font:400 26px/1 var(--serif);color:var(--wine)}

.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:12px 12px 0}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i span{display:block;height:100%;width:0;background:#fff}
.who{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.who .ava{width:34px;height:34px;border-radius:50%;background:#2a1018 url("photos/hero.jpg") 66% 12%/auto 400%;border:2px solid var(--pink)}
.who b{font-weight:600}
.who span{color:var(--dim)}

.tapl,.tapr{position:absolute;top:70px;bottom:100px;z-index:4;background:none;border:0;cursor:pointer}
.tapl{left:0;width:35%}.tapr{right:0;width:65%}

.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:14px 14px 18px;display:flex;gap:10px;align-items:center}
.bottom .cta{flex:1;height:50px;border-radius:999px;background:var(--wine);display:flex;align-items:center;justify-content:center;font-weight:600;box-shadow:0 8px 24px rgba(139,32,57,.5)}
.bottom .reply{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;font-size:20px}

/* Круги-хайлайты справа */
.hl{display:flex;flex-wrap:wrap;gap:14px;max-width:300px}
.hl button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;font-size:11px;color:var(--dim)}
.hl button i{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--pink),var(--wine))}
.hl button i s{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:#2a1018 url("photos/hero.jpg") var(--p) / auto 260%}
.hl button[aria-current="true"]{color:#fff}
@media(prefers-reduced-motion:reduce){.slide{transition:none}}
</style>

<div class="backdrop" aria-hidden="true"></div>
<div class="layout">
  <div class="aside">
    <div class="logo">SHOSTAKOVICH</div>
    <p>Сайт в формате сторис. Истории листаются сами, нажмите справа или слева, чтобы перейти вперёд или назад.</p>
    <p class="kbd"><b>←</b><b>→</b> листать · <b>пробел</b> пауза</p>
  </div>

  <main class="phone" id="phone" aria-roledescription="сторис">
    <div class="top">
      <div class="bars" id="bars"></div>
      <div class="who"><span class="ava"></span><b>shostakovich58</b><span id="ago">Пенза</span></div>
    </div>
    <div id="slides"></div>
    <button class="tapl" id="prev" aria-label="Назад"></button>
    <button class="tapr" id="next" aria-label="Вперёд"></button>
    <div class="bottom"><a class="cta" href="#" id="cta">Записаться на пробное · 400 ₽</a><a class="reply" href="#" aria-label="Написать">✉</a></div>
  </main>

  <div class="aside r">
    <p style="margin-bottom:12px;color:var(--text);font-weight:600">Направления</p>
    <div class="hl" id="hl"></div>
  </div>
</div>

<script>
const SLIDE_MS = 5000;
const SLIDES = [
  {tag:"Пилон · Фитнес · Танцы", h:"Твоё время <i>быть собой</i>", p:"Три студии в Пензе и восемь направлений. Листай дальше →", pos:"66% 30%", size:"auto 100%", sticker:"<b>4,5 ★</b>в ВКонтакте", hl:"Студия"},
  {tag:"Pole Dance · Exotic", h:"Сила, которую <i>видно</i>", p:"Силовые элементы, трюки и хореография. Первый вис уже на пробном.", pos:"48% 20%", size:"auto 150%", hl:"Пилон"},
  {tag:"Стрип-пластика", h:"Пластика <i>и смелость</i>", p:"Чувственность и красота движения. Подготовка не нужна.", pos:"88% 30%", size:"auto 160%", hl:"Танцы"},
  {tag:"Растяжка · Гамаки", h:"Шпагат <i>всё ближе</i>", p:"Гибкость, осанка и спина без боли. Мягко, в своём темпе.", pos:"66% 70%", size:"auto 200%", hl:"Растяжка"},
  {tag:"Джампинг · Банджи · Скульптор", h:"Кардио <i>без скуки</i>", p:"Батуты, тросы и тонус. Заряд на всю неделю.", pos:"60% 90%", size:"auto 180%", hl:"Фитнес"},
  {tag:"Абонементы", h:"Любая студия, <i>любое занятие</i>", list:true, pos:"66% 20%", size:"auto 120%", hl:"Цены"},
  {tag:"Три студии", h:"Выбери <i>свою</i>", addr:true, pos:"70% 40%", size:"auto 110%", hl:"Адреса"}
];
const PRICES = [["Первое занятие","400 ₽",1],["4 в месяц","2 900 ₽"],["8 в месяц","4 500 ₽"],["12 в месяц","5 500 ₽"]];
const ADDR = [["Слава","ул. Славы, 2"],["Суворовский","ул. Суворова, 144А"],["Олимп","пр. Строителей, 9"]];
const slidesEl = document.getElementById("slides"), barsEl = document.getElementById("bars");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let idx = 0, start = performance.now(), paused = false, pausedAt = 0;

slidesEl.innerHTML = SLIDES.map((s, i) => {
  const extra = s.list ? `<ul>${PRICES.map(([a,b,f]) => `<li class="${f ? "first" : ""}"><span>${a}</span><b>${b}</b></li>`).join("")}</ul>`
    : s.addr ? `<ul>${ADDR.map(([a,b]) => `<li><span>${a}</span><span>${b}</span></li>`).join("")}</ul>` : `<p>${s.p}</p>`;
  return `<section class="slide${i === 0 ? " on" : ""}"><div class="bg photo" style="background-position:${s.pos};background-size:${s.size}"></div>${s.sticker ? `<div class="sticker">${s.sticker}</div>` : ""}<span class="tag">${s.tag}</span><h2>${s.h}</h2>${extra}</section>`;
}).join("");
barsEl.innerHTML = SLIDES.map(() => "<i><span></span></i>").join("");
document.getElementById("hl").innerHTML = SLIDES.map((s, i) => `<button data-i="${i}"><i><s style="--p:${s.pos}"></s></i>${s.hl}</button>`).join("");

const slides = [...slidesEl.children], bars = [...barsEl.querySelectorAll("span")], hls = [...document.querySelectorAll("#hl button")];
function go(i){
  idx = (i + SLIDES.length) % SLIDES.length; start = performance.now();
  slides.forEach((s, k) => s.classList.toggle("on", k === idx));
  hls.forEach((b, k) => b.setAttribute("aria-current", String(k === idx)));
}
function tick(now){
  const t = paused ? pausedAt : Math.min(1, (now - start) / SLIDE_MS);
  bars.forEach((b, k) => b.style.width = k < idx ? "100%" : k === idx ? (t * 100) + "%" : "0");
  if (!paused && !reduce && t >= 1) go(idx + 1);
  requestAnimationFrame(tick);
}
function togglePause(){
  if (paused) { start = performance.now() - pausedAt * SLIDE_MS; paused = false; }
  else { pausedAt = Math.min(1, (performance.now() - start) / SLIDE_MS); paused = true; }
}
document.getElementById("next").addEventListener("click", () => go(idx + 1));
document.getElementById("prev").addEventListener("click", () => go(idx - 1));
document.getElementById("hl").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(Number(b.dataset.i)); });
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(idx + 1);
  if (e.key === "ArrowLeft") go(idx - 1);
  if (e.key === " ") { e.preventDefault(); togglePause(); }
});
go(0); requestAnimationFrame(tick);
</script>
