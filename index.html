<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Шостакович — материалы по сайту</title>
<meta property="og:title" content="Шостакович — материалы по сайту">
<meta property="og:description" content="Концепции дизайна нового сайта студии">
<meta property="og:type" content="website">
<meta property="og:image" content="https://postnikovpato-code.github.io/shostakovich-design/koncepcii/thumbs/18-bordo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@300;400&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
header{padding-block:28px;border-bottom:1px solid var(--line)}
main{padding-block:60px}
h1{font:400 clamp(34px,4vw,54px)/1.1 var(--serif);margin:0 0 30px}
.doc{margin-bottom:0;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);max-width:860px}
.doc:hover{border-color:var(--wine-hi)}
.doc img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;display:block}
.doc h2{font:400 26px/1.2 var(--serif);margin:6px 0 6px}
.doc p{margin:0;color:var(--dim)}
@media(max-width:640px){.doc{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="mark"><b>SHOSTAKOVICH</b><span>Материалы по новому сайту</span></div></div></header>
<main class="wrap">
  <h1>Документы</h1>
  <a class="doc" href="koncepcii/">
    <img src="koncepcii/thumbs/18-bordo.jpg" alt="Превью концепций">
    <div><span class="caps" style="color:var(--pink)">Сентябрь 2026</span><h2>Концепции дизайна</h2><p>Варианты оформления главной страницы. Можно отметить понравившиеся и прислать мне выбор.</p></div>
  </a>
  <a class="doc" href="palitry/" style="margin-top:16px">
    <img src="palitry/preview.jpg" alt="Превью палитр">
    <div><span class="caps" style="color:var(--pink)">Сентябрь 2026</span><h2>Варианты палитры</h2><p>Девять цветовых решений. Нажмите на палитру, чтобы примерить её на главную.</p></div>
  </a>
</main>
</body>
</html>
